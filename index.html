<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#14211C">
<title>ตรวจรับ Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14211C; --ink-2:#1E2F28; --ink-3:#2C4038;
  --ledger:#A9C79B; --ledger-pale:#E4EDDC;
  --paper:#F5F7F0; --paper-2:#FFFFFF;
  --stamp:#B4322A; --ok:#1F7A4C; --warn:#B8791C; --muted:#6E7F76;
  --line:rgba(20,33,28,.14);
  --r:10px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--ink); color:var(--paper);
  font-family:'Sarabun',system-ui,sans-serif; font-size:16px; line-height:1.45;
  overscroll-behavior:none;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ledger);outline-offset:2px}

/* ── shell ───────────────────────────── */
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto}

header{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid rgba(169,199,155,.18);flex:0 0 auto;
}
header .mark{
  width:26px;height:26px;flex:0 0 auto;border-radius:5px;background:var(--ledger);
  display:grid;place-items:center;color:var(--ink);font-weight:700;font-size:13px;
}
header h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.01em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{
  font-size:12px;font-weight:600;padding:5px 9px;border-radius:99px;
  border:1px solid rgba(169,199,155,.35);color:var(--ledger);white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--ledger);color:var(--ink);border-color:var(--ledger)}

main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view{display:none;padding:0 0 16px}
.view.on{display:block}

/* ── camera ──────────────────────────── */
.stage{position:relative;background:#000;aspect-ratio:4/3;overflow:hidden}
.stage video{width:100%;height:100%;object-fit:cover;display:block;transform-origin:center}
.stage.off video{opacity:0}
.stage-msg{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  padding:24px;color:var(--muted);font-size:14px;
}
.stage:not(.off) .stage-msg{display:none}

/* กรอบสแกน: แถบแนวนอน + เส้นเล็งกึ่งกลาง (Code 39 ทนการเอียงได้น้อย) */
.reticle{position:absolute;left:6%;right:6%;top:50%;height:23%;transform:translateY(-50%);pointer-events:none}
.reticle::before{
  content:"";position:absolute;inset:0;border:2px solid rgba(255,255,255,.85);border-radius:4px;
  box-shadow:0 0 0 100vmax rgba(0,0,0,.42);
}
.reticle .aim{
  position:absolute;left:8px;right:8px;top:50%;height:2px;transform:translateY(-50%);
  background:var(--stamp);opacity:.9;
}
.reticle .hint{
  position:absolute;left:0;right:0;bottom:-26px;text-align:center;
  font-size:11.5px;color:rgba(255,255,255,.8);
}

.cam-tools{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
.tool{
  width:40px;height:40px;border-radius:9px;background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;font-size:17px;
}
.tool[aria-pressed="true"]{background:var(--ledger);color:var(--ink);border-color:var(--ledger)}
.zoomwrap{
  position:absolute;left:10px;right:60px;bottom:10px;display:flex;align-items:center;gap:9px;
  background:rgba(0,0,0,.5);border-radius:9px;padding:7px 11px;
}
.zoomwrap span{font-size:12px;color:#fff;opacity:.85}
.zoomwrap input{flex:1;accent-color:var(--ledger)}

/* ── status banner (signature) ───────── */
.status{
  position:relative;overflow:hidden;padding:13px 16px;min-height:56px;
  display:flex;align-items:center;gap:12px;background:var(--ink-2);
  border-bottom:1px solid rgba(169,199,155,.15);
}
.status[data-s="ok"]{background:var(--ok)}
.status[data-s="already"]{background:var(--warn)}
.status[data-s="added"]{background:#7A4EA8}
.status[data-s="error"]{background:var(--stamp)}
.status .icon{font-size:22px;flex:0 0 auto}
.status .txt{flex:1;min-width:0}
.status .txt b{display:block;font-size:15px;font-weight:700}
.status .txt small{display:block;font-size:12.5px;opacity:.9}

/* ── record card + stamp ─────────────── */
.card{
  background:var(--paper);color:var(--ink);border-radius:var(--r);
  margin:14px;padding:14px;position:relative;overflow:hidden;
}
.card .an{font-size:26px;font-weight:600;letter-spacing:.04em}
.card .who{font-size:15px;font-weight:600;margin-top:2px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0 0;font-size:13.5px}
.card dt{color:var(--muted)}
.card dd{margin:0}
.card .src{
  margin-top:11px;padding-top:9px;border-top:1px dashed var(--line);
  font-size:12px;color:var(--muted);word-break:break-word;
}
.stamp{
  position:absolute;right:12px;top:16px;
  border:2.5px solid var(--stamp);color:var(--stamp);border-radius:6px;
  padding:5px 10px;font-weight:700;font-size:13px;letter-spacing:.05em;
  transform:rotate(-7deg);opacity:.88;text-align:center;line-height:1.15;
}
.stamp small{display:block;font-size:10px;letter-spacing:.12em;opacity:.85}
.stamp.hit{animation:thud .42s cubic-bezier(.2,1.5,.4,1) both}
@keyframes thud{
  0%{transform:rotate(-16deg) scale(2.6);opacity:0}
  55%{transform:rotate(-5deg) scale(.94);opacity:1}
  100%{transform:rotate(-7deg) scale(1);opacity:.88}
}
@media (prefers-reduced-motion:reduce){.stamp.hit{animation:none}}

/* ── generic bits ────────────────────── */
.row{display:flex;gap:9px;padding:0 14px;margin-bottom:11px}
.btn{
  flex:1;padding:13px;border-radius:var(--r);font-weight:600;font-size:15px;text-align:center;
  background:var(--ink-3);border:1px solid rgba(169,199,155,.22);
}
.btn.primary{background:var(--ledger);color:var(--ink);border-color:var(--ledger)}
.btn.ghost{background:none}
.btn[disabled]{opacity:.4}
.seg{display:flex;padding:0 14px;gap:0;margin:12px 0}
.seg button{
  flex:1;padding:10px;font-size:14px;font-weight:600;border:1px solid rgba(169,199,155,.25);
  background:none;color:var(--muted);
}
.seg button:first-child{border-radius:var(--r) 0 0 var(--r)}
.seg button:last-child{border-radius:0 var(--r) var(--r) 0;border-left:0}
.seg button[aria-pressed="true"]{background:var(--ledger);color:var(--ink);border-color:var(--ledger)}

.field{padding:0 14px;margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.field select,.field input{
  width:100%;padding:12px;border-radius:var(--r);font:inherit;
  background:var(--ink-2);color:var(--paper);border:1px solid rgba(169,199,155,.25);
}
.field input.mono{font-family:'IBM Plex Mono',monospace;font-size:19px;letter-spacing:.06em}

.list{padding:0 14px}
.item{
  display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid rgba(169,199,155,.13);
}
.item .dot{width:9px;height:9px;border-radius:99px;flex:0 0 auto;background:var(--muted)}
.item[data-s="ok"] .dot{background:#4FD98C}
.item[data-s="already"] .dot{background:#EFB443}
.item[data-s="added"] .dot{background:#B78BE0}
.item[data-s="error"] .dot,.item[data-s="pending"] .dot{background:var(--stamp)}
.item .an{flex:1;font-size:17px;letter-spacing:.03em}
.item .meta{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.3}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px}
.note{padding:0 14px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.count{font-size:12px;color:var(--muted);padding:0 14px;margin:10px 0}

/* ── tab bar ─────────────────────────── */
nav{
  flex:0 0 auto;display:flex;border-top:1px solid rgba(169,199,155,.18);
  padding-bottom:var(--safe-b);background:var(--ink);
}
nav button{flex:1;padding:11px 4px 9px;text-align:center;color:var(--muted);font-size:11.5px;font-weight:600}
nav button .ic{display:block;font-size:19px;margin-bottom:1px}
nav button[aria-pressed="true"]{color:var(--ledger)}
nav .badge{
  display:inline-block;min-width:17px;padding:0 5px;border-radius:99px;background:var(--stamp);
  color:#fff;font-size:10.5px;line-height:17px;margin-left:4px;
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="mark">✓</div>
    <h1 data-i18n="appTitle">ตรวจรับ Chart</h1>
    <button class="chip" id="langBtn">EN</button>
  </header>

  <main>
    <!-- ══ สแกน ══ -->
    <section class="view on" id="v-scan">
      <div class="stage off" id="stage">
        <video id="video" playsinline muted autoplay></video>
        <div class="stage-msg" id="stageMsg" data-i18n="camIdle">กดเริ่มสแกนเพื่อเปิดกล้อง</div>
        <div class="reticle" id="reticle" hidden>
          <div class="aim"></div>
          <div class="hint" data-i18n="aimHint">วางบาร์โค้ดให้ทับเส้นแดง ถือให้ตรง</div>
        </div>
        <div class="cam-tools" id="camTools" hidden>
          <button class="tool" id="torchBtn" aria-pressed="false" title="ไฟฉาย">🔦</button>
          <button class="tool" id="focusBtn" title="โฟกัส">◎</button>
        </div>
        <div class="zoomwrap" id="zoomWrap" hidden>
          <span>−</span><input type="range" id="zoom" min="1" max="4" step="0.1" value="1"><span>+</span>
        </div>
      </div>

      <div class="status" id="status" data-s="idle">
        <div class="icon" id="stIcon">◻</div>
        <div class="txt"><b id="stTitle" data-i18n="ready">พร้อมสแกน</b><small id="stSub" data-i18n="readySub">เลือกชื่อผู้ตรวจรับก่อนเริ่ม</small></div>
      </div>

      <div id="cardSlot"></div>

      <div class="row">
        <button class="btn primary" id="camBtn" data-i18n="startCam">เริ่มสแกน</button>
        <button class="btn" id="manualBtn" data-i18n="manual">พิมพ์เลข AN</button>
      </div>

      <div id="manualBox" hidden>
        <div class="field">
          <label data-i18n="manualLabel">เลข AN (9 หลัก)</label>
          <input class="mono" id="manualIn" inputmode="numeric" autocomplete="off" placeholder="690012053">
        </div>
        <div class="row"><button class="btn primary" id="manualGo" data-i18n="add">เพิ่มรายการ</button></div>
      </div>

      <div class="seg" role="group">
        <button id="modeSingle" aria-pressed="true" data-i18n="modeSingle">ทีละรายการ</button>
        <button id="modeBatch" aria-pressed="false" data-i18n="modeBatch">สแกนหลายรายการ</button>
      </div>
      <p class="note" id="modeNote" data-i18n="modeNoteSingle">สแกนแล้วบันทึกลงชีตทันที</p>

      <div class="field">
        <label data-i18n="staffLabel">ผู้ตรวจรับ</label>
        <select id="staff"><option value="" data-i18n="staffPick">— เลือกชื่อ —</option></select>
      </div>

      <div class="row" id="commitRow" hidden>
        <button class="btn primary" id="commitBtn"><span data-i18n="commit">บันทึกลงชีต</span> (<span id="pendCount">0</span>)</button>
      </div>
    </section>

    <!-- ══ รายการ ══ -->
    <section class="view" id="v-list">
      <p class="count" id="listCount"></p>
      <div class="list" id="list"></div>
      <div class="row" style="margin-top:16px">
        <button class="btn" id="retryBtn" data-i18n="retry">ส่งรายการค้างอีกครั้ง</button>
        <button class="btn ghost" id="clearBtn" data-i18n="clear">ล้างประวัติ</button>
      </div>
      <p class="note" data-i18n="listNote">ประวัติจะเริ่มใหม่อัตโนมัติเมื่อขึ้นวันใหม่ รายการที่บันทึกลงชีตแล้วจะยังอยู่ในชีตเสมอ</p>
    </section>

    <!-- ══ ตั้งค่า ══ -->
    <section class="view" id="v-set">
      <div class="field" style="margin-top:14px">
        <label data-i18n="beepLabel">การแจ้งเตือน</label>
        <div class="seg" style="padding:0">
          <button id="sndBtn" aria-pressed="true" data-i18n="sound">เสียง</button>
          <button id="vibBtn" aria-pressed="true" data-i18n="vibrate">สั่น</button>
        </div>
      </div>
      <p class="note" data-i18n="vibNote">การสั่นใช้ได้เฉพาะ Android — บน iPhone ให้ใช้เสียงแทน</p>
      <div class="field">
        <label data-i18n="urlLabel">ที่อยู่ Apps Script (/exec)</label>
        <input id="apiUrl" placeholder="https://script.google.com/…/exec" autocomplete="off">
      </div>
      <div class="field">
        <label data-i18n="tokenLabel">รหัสเชื่อมต่อ</label>
        <input id="apiToken" autocomplete="off">
      </div>
      <div class="row"><button class="btn primary" id="saveCfg" data-i18n="testSave">ทดสอบและบันทึก</button></div>
      <p class="note" id="cfgMsg"></p>
    </section>
  </main>

  <nav>
    <button id="tab-scan" aria-pressed="true"><span class="ic">▣</span><span data-i18n="tabScan">สแกน</span></button>
    <button id="tab-list" aria-pressed="false"><span class="ic">☰</span><span data-i18n="tabList">รายการ</span><span class="badge" id="tabBadge" hidden>0</span></button>
    <button id="tab-set" aria-pressed="false"><span class="ic">⚙</span><span data-i18n="tabSet">ตั้งค่า</span></button>
  </nav>
</div>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

let LANG = "th";
const t = k => (I18N[LANG][k] ?? k);

function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  $("langBtn").textContent = LANG === "th" ? "EN" : "ไทย";
  $("camBtn").textContent  = running ? t("stopCam") : t("startCam");
  $("modeNote").textContent = mode === "batch" ? t("modeNoteBatch") : t("modeNoteSingle");
  renderList();
}

/* ═══ 2. ที่เก็บข้อมูล ═════════════════════════════════════
   ห่อ localStorage ไว้ เพราะบางบริบท (preview / โหมดส่วนตัว) เขียนไม่ได้
   ถ้าเขียนไม่ได้ให้ใช้หน่วยความจำแทน แอปยังทำงานได้ในรอบนั้น        */
const Store = (() => {
  let ok = true, mem = {};
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); } catch(e){ ok = false; }
  return {
    ok,
    get:k => { try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch(e){ return mem[k] ?? null; } },
    set:(k,v) => { try { ok ? localStorage.setItem(k,v) : (mem[k]=v); } catch(e){ mem[k]=v; } }
  };
})();

const KEY = { SESSION:"cr_session", CFG:"cr_cfg", PREF:"cr_pref" };
const todayKey = () => new Date().toLocaleDateString("sv-SE");   // 2026-08-22 ตามเวลาเครื่อง

let cfg = { url:"", token:"" };
let pref = { lang:"th", sound:true, vibrate:true, staff:"" };
let session = { date:todayKey(), items:[] };
let mode = "single";

function loadAll(){
  try { Object.assign(cfg,  JSON.parse(Store.get(KEY.CFG)  || "{}")); } catch(e){}
  try { Object.assign(pref, JSON.parse(Store.get(KEY.PREF) || "{}")); } catch(e){}
  try {
    const s = JSON.parse(Store.get(KEY.SESSION) || "null");
    if (s && s.date === todayKey()) session = s;
  } catch(e){}
  LANG = pref.lang || "th";
}
const saveSession = () => Store.set(KEY.SESSION, JSON.stringify(session));
const savePref    = () => Store.set(KEY.PREF, JSON.stringify(pref));

/* รีเซ็ตรายวัน — ตรวจทั้งตอนเปิดแอปและตอนกลับมาหน้าจอ */
function rollDate(){
  const d = todayKey();
  if (session.date === d) return;
  const stuck = session.items.filter(i => i.status === "pending" || i.status === "queued");
  session = { date:d, items:stuck };          // รายการที่ยังไม่ถูกบันทึกจะไม่หาย
  saveSession(); renderList(); updateBadge();
}

/* ═══ 3. เสียง / การสั่น ═══════════════════════════════ */
let actx = null;
function beep(kind){
  if (!pref.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const seq = { ok:[[880,.09]], warn:[[620,.08],[0,.05],[620,.08]], error:[[240,.32]] }[kind] || [[880,.09]];
    let at = actx.currentTime;
    seq.forEach(([hz,dur]) => {
      if (hz){
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = "square"; o.frequency.value = hz;
        g.gain.setValueAtTime(.0001, at);
        g.gain.exponentialRampToValueAtTime(.18, at + .012);
        g.gain.exponentialRampToValueAtTime(.0001, at + dur);
        o.connect(g).connect(actx.destination); o.start(at); o.stop(at + dur + .02);
      }
      at += dur;
    });
  } catch(e){}
}
function buzz(kind){
  if (!pref.vibrate || !navigator.vibrate) return;   // iOS ไม่รองรับ — เงียบไปเฉย ๆ
  try { navigator.vibrate({ ok:60, warn:[45,55,45], error:[130,60,130] }[kind] || 60); } catch(e){}
}
const alertUser = kind => { beep(kind); buzz(kind); };

/* ═══ 4. เรียก API ═════════════════════════════════════
   ส่งเป็น text/plain เพื่อเลี่ยง CORS preflight
   (Apps Script ไม่รองรับ OPTIONS — ถ้าส่ง application/json จะโดนบล็อก) */
async function api(action, payload, url, token){
  const target = url || cfg.url, tok = token !== undefined ? token : cfg.token;
  if (!target) throw new Error("NO_URL");
  const res = await fetch(target, {
    method:"POST", redirect:"follow",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({ action, token:tok }, payload || {}))
  });
  if (!res.ok) throw new Error("HTTP_" + res.status);
  const data = await res.json();
  if (!data.ok && data.error === "TOKEN_INVALID") throw new Error("TOKEN_INVALID");
  return data;
}

/* ═══ 5. หน้าจอ ════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const normalizeAN = v => String(v ?? "").replace(/\D/g, "");

function setStatus(s, title, sub){
  const el = $("status");
  el.dataset.s = s;
  $("stIcon").textContent  = { ok:"✓", already:"!", added:"+", error:"✕", idle:"◻" }[s] || "◻";
  $("stTitle").textContent = title;
  $("stSub").textContent   = sub || "";
}

function showCard(rec, stamped){
  if (!rec){ $("cardSlot").innerHTML = ""; return; }
  const rows = [
    rec.name   ? [t("name"), rec.name] : null,
    rec.rights ? [t("rights"), rec.rights] : null,
    rec.sent   ? [t("sent"), rec.sent] : null
  ].filter(Boolean);

  $("cardSlot").innerHTML =
    '<div class="card">' +
      (stamped ? '<div class="stamp hit">' + esc(t("stamp")) + '<small>' + esc(stamped) + '</small></div>' : '') +
      '<div class="an mono">' + esc(rec.an) + '</div>' +
      (rows.length ? '<dl>' + rows.map(r => '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>').join('') + '</dl>' : '') +
      (rec.sheet ? '<div class="src">' + esc(t("sheet")) + ' · ' + esc(rec.sheet) + '</div>' : '') +
    '</div>';
}
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderList(){
  const items = session.items.slice().reverse();
  $("listCount").textContent = items.length ? items.length + " " + (LANG==="th"?"รายการ":"items") : "";
  if (!items.length){ $("list").innerHTML = '<p class="empty">' + esc(t("empty")) + '</p>'; return; }
  $("list").innerHTML = items.map(i =>
    '<div class="item" data-s="' + esc(i.status) + '">' +
      '<span class="dot"></span>' +
      '<span class="an mono">' + esc(i.an) + '</span>' +
      '<span class="meta">' + esc(i.label || "") + '<br>' + esc(i.time || "") + '</span>' +
    '</div>').join("");
}
function updateBadge(){
  const n = session.items.filter(i => i.status === "queued" || i.status === "pending").length;
  $("tabBadge").hidden = !n; $("tabBadge").textContent = n;
  $("pendCount").textContent = n;
  $("commitRow").hidden = n === 0;
  $("retryBtn").disabled = !session.items.some(i => i.status === "pending");
}
const clockStr = () => new Date().toLocaleTimeString(LANG==="th"?"th-TH":"en-GB",{hour:"2-digit",minute:"2-digit"});

/* ═══ 6. กระบวนการสแกน ════════════════════════════════ */
let running = false, lastCode = "", lastAt = 0, busy = false;
const COOLDOWN = 2500;   // กล้องอ่านซ้ำได้หลายสิบครั้ง/วินาที ต้องกันไว้

async function handleCode(raw){
  const an = normalizeAN(raw);
  if (an.length < 6) return;

  const now = Date.now();
  if (an === lastCode && now - lastAt < COOLDOWN) return;   // อ่านรัวจากเฟรมเดียวกัน
  lastCode = an; lastAt = now;

  if (session.items.some(i => i.an === an && i.status !== "error")){
    alertUser("warn");
    setStatus("already", t("sDup"), t("sDupSub"));
    showCard({ an });
    return;
  }
  if (busy) return;
  await processAN(an);
}

async function processAN(an){
  if (!pref.staff){ alertUser("error"); setStatus("error", t("sNoStaff"), t("sNoStaffSub")); return; }
  if (!cfg.url){ alertUser("error"); setStatus("error", t("sNoCfg"), t("sNoCfgSub")); return; }

  busy = true;
  // เขียนลงเครื่องก่อนเสมอ — เน็ตหลุดข้อมูลจะได้ไม่หาย
  const entry = { an, status:"queued", label:t("sQueued"), time:clockStr() };
  session.items.push(entry); saveSession(); renderList(); updateBadge();

  try {
    const res = await api("lookup", { an });
    const hit = res.found ? res.matches[0] : null;

    if (hit && hit.recvDate){
      entry.status = "already"; entry.label = t("sAlready"); entry.sheet = hit.sheet; entry.row = hit.row;
      alertUser("warn");
      setStatus("already", t("sAlready"), t("sAlreadySub") + hit.recvDate + (hit.recvBy ? " · " + hit.recvBy : ""));
      showCard(hit);
    } else if (hit){
      entry.sheet = hit.sheet; entry.row = hit.row; entry.name = hit.name;
      if (mode === "single"){
        const stamp = await commitItems([entry]);
        showCard(hit, stamp || "");
      } else {
        alertUser("ok");
        setStatus("ok", t("sFound"), t("sQueuedSub"));
        showCard(hit);
      }
    } else {
      entry.label = t("sMissing");
      if (mode === "single"){
        const stamp = await commitItems([entry]);
        showCard({ an }, stamp || "");
      } else {
        alertUser("warn");
        setStatus("added", t("sMissing"), t("sMissingSub"));
        showCard({ an });
      }
    }
  } catch (err){
    entry.status = "pending"; entry.label = t("sPending");
    alertUser("error");
    setStatus("error", t("sPending"), t("sPendingSub"));
    showCard({ an });
  }

  saveSession(); renderList(); updateBadge(); busy = false;
}

async function commitItems(entries){
  const list = entries.filter(e => e.status === "queued" || e.status === "pending");
  if (!list.length) return "";
  let stamp = "";
  try {
    const res = await api("commit", {
      user: pref.staff,
      items: list.map(e => ({ an:e.an, sheet:e.sheet, row:e.row }))
    });
    if (!res.ok) throw new Error(res.error || "FAIL");
    stamp = res.stamp || "";

    res.results.forEach((r, i) => {
      const e = list[i]; if (!e) return;
      e.status = r.status === "ok" ? "ok" : r.status === "added" ? "added" : r.status === "already" ? "already" : "pending";
      e.label  = { ok:t("sFound"), added:t("sAdded"), already:t("sAlready") }[r.status] || t("sPending");
      e.time   = clockStr();
      if (r.sheet){ e.sheet = r.sheet; e.row = r.row; }
    });

    const worst = res.results.some(r => r.status === "added") ? "added"
                : res.results.some(r => r.status === "already") ? "already" : "ok";
    alertUser(worst === "ok" ? "ok" : "warn");
    setStatus(worst,
      worst === "ok" ? t("sFound") : worst === "added" ? t("sAdded") : t("sAlready"),
      worst === "ok" ? t("sFoundSub") : worst === "added" ? t("sAddedSub") : "");

  } catch (err){
    list.forEach(e => { e.status = "pending"; e.label = t("sPending"); });
    alertUser("error");
    setStatus("error", t("sPending"), t("sPendingSub"));
  }
  saveSession(); renderList(); updateBadge();
  return stamp;
}

/* ═══ 7. กล้อง ═════════════════════════════════════════ */
let reader = null, track = null, digitalZoom = 1;

function makeReader(){
  const hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
    ZXing.BarcodeFormat.CODE_39,      // ← บาร์โค้ดบน chart จริง
    ZXing.BarcodeFormat.CODE_128
  ]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  return new ZXing.BrowserMultiFormatReader(hints, 200);
}

async function startCam(){
  try {
    reader = reader || makeReader();
    await reader.decodeFromConstraints(
      { video:{ facingMode:{ ideal:"environment" }, width:{ ideal:1920 }, height:{ ideal:1080 } } },
      $("video"),
      (result) => { if (result) handleCode(result.getText()); }
    );
    running = true;
    $("stage").classList.remove("off");
    $("reticle").hidden = false; $("camTools").hidden = false; $("zoomWrap").hidden = false;
    $("camBtn").textContent = t("stopCam");
    setupCamControls();
    beep("ok");   // ปลุก AudioContext ด้วยการกดของผู้ใช้
  } catch (err){
    setStatus("error", t("sCamFail"), t("sCamFailSub"));
    $("manualBox").hidden = false;
  }
}

function stopCam(){
  try { reader && reader.reset(); } catch(e){}
  running = false; track = null;
  $("stage").classList.add("off");
  $("reticle").hidden = true; $("camTools").hidden = true; $("zoomWrap").hidden = true;
  $("camBtn").textContent = t("startCam");
}

function setupCamControls(){
  const stream = $("video").srcObject;
  track = stream && stream.getVideoTracks ? stream.getVideoTracks()[0] : null;
  if (!track) return;
  const caps = track.getCapabilities ? track.getCapabilities() : {};

  $("torchBtn").hidden = !caps.torch;

  const z = $("zoom");
  if (caps.zoom){                     // Android: ซูมด้วยเลนส์จริง คมกว่า
    z.min = caps.zoom.min; z.max = Math.min(caps.zoom.max, caps.zoom.min * 5);
    z.step = caps.zoom.step || .1; z.value = caps.zoom.min;
    z.dataset.native = "1";
  } else {                            // iOS: ไม่มี zoom API — ใช้ขยายภาพแทน
    z.min = 1; z.max = 4; z.step = .1; z.value = digitalZoom;
    z.dataset.native = "";
  }
  try { track.applyConstraints({ advanced:[{ focusMode:"continuous" }] }); } catch(e){}
}

$("zoom").addEventListener("input", e => {
  const v = parseFloat(e.target.value);
  if (e.target.dataset.native && track){
    track.applyConstraints({ advanced:[{ zoom:v }] }).catch(()=>{});
  } else {
    digitalZoom = v;
    $("video").style.transform = "scale(" + v + ")";
  }
});

$("torchBtn").addEventListener("click", () => {
  if (!track) return;
  const on = $("torchBtn").getAttribute("aria-pressed") === "true";
  track.applyConstraints({ advanced:[{ torch:!on }] })
    .then(() => $("torchBtn").setAttribute("aria-pressed", String(!on)))
    .catch(()=>{});
});

$("focusBtn").addEventListener("click", () => {
  if (!track) return;
  // สั่งโฟกัสใหม่ — จำเป็นเพราะ Code 39 ทนภาพเบลอได้น้อยมาก
  track.applyConstraints({ advanced:[{ focusMode:"manual" }] })
    .then(() => track.applyConstraints({ advanced:[{ focusMode:"continuous" }] }))
    .catch(()=>{});
});

/* ═══ 8. เหตุการณ์อื่น ═════════════════════════════════ */
$("camBtn").addEventListener("click", () => running ? stopCam() : startCam());

$("manualBtn").addEventListener("click", () => {
  const b = $("manualBox"); b.hidden = !b.hidden;
  if (!b.hidden) $("manualIn").focus();
});
$("manualGo").addEventListener("click", async () => {
  const an = normalizeAN($("manualIn").value);
  if (an.length < 6) return;
  $("manualIn").value = "";
  if (session.items.some(i => i.an === an && i.status !== "error")){
    alertUser("warn"); setStatus("already", t("sDup"), t("sDupSub")); showCard({ an }); return;
  }
  await processAN(an);
});
$("manualIn").addEventListener("keydown", e => { if (e.key === "Enter") $("manualGo").click(); });

function setMode(m){
  mode = m;
  $("modeSingle").setAttribute("aria-pressed", String(m === "single"));
  $("modeBatch").setAttribute("aria-pressed", String(m === "batch"));
  $("modeNote").textContent = m === "batch" ? t("modeNoteBatch") : t("modeNoteSingle");
  updateBadge();
}
$("modeSingle").addEventListener("click", () => setMode("single"));
$("modeBatch").addEventListener("click", () => setMode("batch"));

$("commitBtn").addEventListener("click", () =>
  commitItems(session.items.filter(i => i.status === "queued" || i.status === "pending")));
$("retryBtn").addEventListener("click", () =>
  commitItems(session.items.filter(i => i.status === "pending")));

$("clearBtn").addEventListener("click", () => {
  const unsaved = session.items.some(i => i.status === "queued" || i.status === "pending");
  if (!confirm(unsaved ? t("confirmClearPending") : t("confirmClear"))) return;
  session.items = []; saveSession(); renderList(); updateBadge(); showCard(null);
  setStatus("idle", t("ready"), t("readySub"));
});

$("staff").addEventListener("change", e => { pref.staff = e.target.value; savePref(); });
$("sndBtn").addEventListener("click", () => {
  pref.sound = !pref.sound; $("sndBtn").setAttribute("aria-pressed", String(pref.sound)); savePref();
  if (pref.sound) beep("ok");
});
$("vibBtn").addEventListener("click", () => {
  pref.vibrate = !pref.vibrate; $("vibBtn").setAttribute("aria-pressed", String(pref.vibrate)); savePref();
  if (pref.vibrate) buzz("ok");
});
$("langBtn").addEventListener("click", () => {
  LANG = LANG === "th" ? "en" : "th"; pref.lang = LANG; savePref(); applyLang();
});

$("saveCfg").addEventListener("click", async () => {
  const url = $("apiUrl").value.trim(), token = $("apiToken").value.trim();
  $("cfgMsg").textContent = "…";
  try {
    const res = await api("ping", {}, url, token);
    if (!res.ok) throw new Error(res.error || "FAIL");
    cfg = { url, token }; Store.set(KEY.CFG, JSON.stringify(cfg));
    fillStaff(res.staff || []);
    $("cfgMsg").textContent = t("cfgOk") + " · " + (res.staff || []).length + " " + (LANG==="th"?"ชื่อ":"names");
  } catch (err){
    $("cfgMsg").textContent = t("cfgFail") + err.message;
  }
});

function fillStaff(names){
  const sel = $("staff");
  sel.innerHTML = '<option value="">' + esc(t("staffPick")) + '</option>' +
    names.map(n => '<option value="' + esc(n) + '"' + (n === pref.staff ? " selected" : "") + '>' + esc(n) + '</option>').join("");
}

["scan","list","set"].forEach(name => {
  $("tab-" + name).addEventListener("click", () => {
    ["scan","list","set"].forEach(n => {
      $("tab-" + n).setAttribute("aria-pressed", String(n === name));
      $("v-" + n).classList.toggle("on", n === name);
    });
    if (name !== "scan" && running) stopCam();
  });
});

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") rollDate();
  else if (running) stopCam();      // ปล่อยกล้องเมื่อสลับแอป
});

/* ═══ 9. เริ่มทำงาน ════════════════════════════════════ */
(function init(){
  loadAll();
  $("apiUrl").value = cfg.url; $("apiToken").value = cfg.token;
  $("sndBtn").setAttribute("aria-pressed", String(pref.sound));
  $("vibBtn").setAttribute("aria-pressed", String(pref.vibrate));
  applyLang(); setMode("single"); renderList(); updateBadge();
  setStatus("idle", t("ready"), t("readySub"));
  if (cfg.url) api("ping", {}).then(r => { if (r.ok) fillStaff(r.staff || []); }).catch(()=>{});
  setInterval(rollDate, 60000);
})();
</script>
